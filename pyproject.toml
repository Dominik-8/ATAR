[project]
name = "atar"
version = "0.1.0"
description = "ATAR — Agent Trust & Attribution Root: the free, decentralized trust layer for AI agents (did:agent: + signed vouches + ATC carrier)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography", "base58", "click"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
atar = "atar.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
