[project]
name = "atar-trust"
version = "1.0.0a3.dev0"
description = "ATAR — Agent Trust & Attribution Root: the free, decentralized trust layer for AI agents (did:key + W3C Verifiable Credentials + signed vouches + A2A agent cards)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Dominik Brück" },
]
keywords = [
    "ai-agents",
    "decentralized-identity",
    "did",
    "ed25519",
    "trust",
    "web-of-trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["cryptography", "base58", "click"]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.6", "hypothesis==6.168.0"]

[project.urls]
Repository = "https://github.com/Dominik-8/ATAR"
Issues = "https://github.com/Dominik-8/ATAR/issues"
Changelog = "https://github.com/Dominik-8/ATAR/blob/master/CHANGELOG.md"
Specification = "https://github.com/Dominik-8/ATAR/blob/master/SPEC.md"

[project.scripts]
atar = "atar.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atar"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Pinned rule set so CI and local runs are reproducible across ruff versions.
# Curated for bug-catching value over stylistic noise; every enabled family
# passes on the current tree.
select = [
    "F",      # pyflakes: unused imports/variables, undefined names, redefinitions
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort: canonical import ordering
    "UP",     # pyupgrade: modern idioms for the Python 3.11 floor
    "B",      # flake8-bugbear: likely bugs and design problems
    "SIM",    # flake8-simplify
    "S",      # bandit security checks
    "BLE",    # blind except clauses
    "PIE",    # flake8-pie
    "C4",     # comprehension best practices
    "RET",    # return-statement idioms
    "RUF",    # ruff-native checks
    "FURB",   # refurb
    "TRY004", # type errors must raise TypeError, not ValueError
]
ignore = [
    "E501",  # line length is owned by the formatter (line-length above), not the linter
]

[tool.ruff.lint.per-file-ignores]
# asserts, seeded RNGs and local HTTP/subprocess calls are test idioms
"tests/**" = ["S101", "S310", "S311", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
