[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atar"
version = "0.1.0"
description = "Decentralized open-source ID + trust layer for AI agents"
requires-python = "^3.11"
dependencies = [
    "cryptography",
    "base58",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["atar*"]
