name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (pinned)
        run: pip install ruff==0.16.6
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Sdist carries the test suite
        run: tar tzf dist/*.tar.gz | grep -q "tests/test_vouch.py"
      - name: Install the wheel into a clean environment and smoke-test the CLI
        run: |
          python -m venv /tmp/dist-venv
          /tmp/dist-venv/bin/pip install dist/*.whl
          export HOME="$RUNNER_TEMP/dist-home"
          mkdir -p "$HOME"
          cd "$RUNNER_TEMP"
          /tmp/dist-venv/bin/atar --help >/dev/null
          /tmp/dist-venv/bin/atar keygen --name ci-smoke-a
          /tmp/dist-venv/bin/atar keygen --name ci-smoke-b
          /tmp/dist-venv/bin/atar vouch --from ci-smoke-a --for ci-smoke-b --score 0.9 --scope ci-smoke --out smoke-vouch.json
          /tmp/dist-venv/bin/atar verify smoke-vouch.json | grep -q "^VALID$"
      - name: Installed version matches pyproject
        run: |
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          INSTALLED_VERSION="$(/tmp/dist-venv/bin/python -c 'import atar; print(atar.__version__)')"
          echo "pyproject=$PKG_VERSION installed=$INSTALLED_VERSION"
          test "$PKG_VERSION" = "$INSTALLED_VERSION"
      - name: Install from the sdist and smoke-test
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/atar --help >/dev/null
