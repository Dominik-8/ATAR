# ATAR real agent network — reproducible bootstrap config.
# Contains ONLY agents that are real running processes.
# Run:  atar bootstrap --config agents.toml
# Then: atar serve   (open http://localhost:8765)
#
# Demo / illustration agents live in demo.toml (NOT real processes).

[[agents]]
name = "seed_agent"
seed = true            # root of trust — this is your real ATAR agent

[[agents]]
name = "daily_brief"   # REAL: the ATAR nightly brief cron job

# Trust edge: ATAR vouches for the daily_brief (both real processes).
[[vouches]]
issuer = "seed_agent"
subject = "daily_brief"
score = 0.95
scope = "intelligence"
