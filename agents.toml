# ATAR real agent network — reproducible bootstrap config.
# Contains ONLY agents that are real running processes.
# Run:  atar bootstrap --config agents.toml
# Then: atar serve   (open http://localhost:8765)
#
# Demo / illustration agents live in demo.toml (NOT real processes).

[[agents]]
name = "seed_agent"
seed = true            # root of trust — your primary agent

[[agents]]
name = "reporting_agent"   # e.g. a nightly brief cron job

# Trust edge: seed vouches for the reporting agent.
[[vouches]]
issuer = "seed_agent"
subject = "reporting_agent"
score = 0.95
scope = "intelligence"
